<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Cradle Physics Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .cradle-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.5));
        }

        /* Wooden/Metallic Top Base Bar */
        .cradle-top {
            width: 380px;
            height: 24px;
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        /* Side Support Pillars */
        .cradle-top::before, .cradle-top::after {
            content: '';
            position: absolute;
            top: 20px;
            width: 16px;
            height: 320px;
            background: linear-gradient(90deg, #475569, #334155, #1e293b);
            border-radius: 4px;
        }
        .cradle-top::before { left: 15px; transform: skewX(-5deg); }
        .cradle-top::after { right: 15px; transform: skewX(5deg); }

        /* Base Stand Platform */
        .cradle-base {
            width: 480px;
            height: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 10px;
            margin-top: 310px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .balls-row {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            height: 300px;
            width: 320px;
            pointer-events: none;
        }

        /* Individual Ball Unit */
        .ball-container {
            position: relative;
            width: 44px;
            height: 100%;
            transform-origin: top center;
        }

        /* Suspension Strings */
        .ball-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1.5px;
            height: 240px;
            background: rgba(226, 232, 240, 0.4);
            transform: translateX(-50%);
        }

        /* The Metallic Sphere */
        .ball {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 30%, #64748b 70%, #0f172a 100%);
            border-radius: 50%;
            box-shadow: inset -4px -4px 10px rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0, 0, 0, 0.5);
        }
		
        .ball-container:nth-child(1) {
            animation: swingLeft 1.4s cubic-bezier(0.36, 0, 0.64, 1) infinite;
        }

        .ball-container:nth-child(5) {
            animation: swingRight 1.4s cubic-bezier(0.36, 0, 0.64, 1) infinite;
        }

        /* Middle balls remain completely static during impact */
        .ball-container:nth-child(2),
        .ball-container:nth-child(3),
        .ball-container:nth-child(4) {
            animation: none;
        }

        @keyframes swingLeft {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-35deg); } /* Swings up left */
            50% { transform: rotate(0deg); }   /* Hits center */
            75%, 100% { transform: rotate(0deg); } /* Rests while right ball swings */
        }

        @keyframes swingRight {
            0%, 50% { transform: rotate(0deg); } /* Rests while left ball approaches */
            75% { transform: rotate(35deg); }   /* Swings up right */
            100% { transform: rotate(0deg); }  /* Returns to center */
        }

    </style>
</head>
<body>

    <div class="cradle-container">
        <div class="cradle-top"></div>
        
        <div class="balls-row">
            <div class="ball-container"><div class="ball"></div></div>
            <div class="ball-container"><div class="ball"></div></div>
            <div class="ball-container"><div class="ball"></div></div>
            <div class="ball-container"><div class="ball"></div></div>
            <div class="ball-container"><div class="ball"></div></div>
        </div>

        <div class="cradle-base"></div>
    </div>

  

</body>
</html>
